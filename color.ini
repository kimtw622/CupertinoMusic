; CupertinoMusic - color schemes
;
; 값은 # 없는 6자리 16진수. 여기 적힌 모든 키는 Spicetify가
;   --spice-<key>      (예: #fa2d48)
;   --spice-rgb-<key>  (예: 250,45,72)
; 두 가지 CSS 변수로 내보낸다. 표준 키 외에 이 테마 전용 키도 같은 방식으로 쓴다.
;
; 스킴 전환:  spicetify config color_scheme Light   (또는 Dark)  →  spicetify apply

[Light]
; --- Spicetify 표준 키 ---
text               = 1D1D1F
subtext            = 6E6E73
main               = FFFFFF
main-elevated      = FFFFFF
highlight          = F2F2F4
highlight-elevated = EBEBEE
sidebar            = F5F5F7
player             = F5F5F7
card               = FFFFFF
shadow             = 000000
selected-row       = 1D1D1F
button             = FA2D48
button-active      = FA2D48
button-disabled    = C7C7CC
tab-active         = E8E8ED
notification       = 0066CC
notification-error = D70015
misc               = 8E8E93
; --- CupertinoMusic 전용 키 ---
; ink: 구분선·hover·선택 배경을 만드는 기준색 (낮은 불투명도로만 사용)
ink                = 000000
; accent-text: 작은 글자용 붉은색 (흰 배경 대비 5.4:1)
accent-text        = D60017
; accent-solid: 흰 글자가 올라가는 채워진 버튼 배경 (대비 4.8:1)
accent-solid       = E0173A
on-accent          = FFFFFF
; 의미 색상 (오류·경고·성공·안내) - 포인트색과 섞이지 않게 분리
negative           = D70015
warning            = B25000
positive           = 1F7A35
announcement       = 0066CC
toggle-on          = 34C759
; 커버 위에 얹는 재생 버튼 등, 이미지 위 컨트롤의 바탕
over-media         = 1C1C1E

[Dark]
; --- Spicetify 표준 키 ---
text               = F5F5F7
subtext            = A1A1A6
main               = 18181A
main-elevated      = 2C2C2E
highlight          = 242426
highlight-elevated = 303032
sidebar            = 242426
player             = 242426
card               = 242426
shadow             = 000000
selected-row       = F5F5F7
button             = FA2D48
button-active      = FA2D48
button-disabled    = 48484A
tab-active         = 3A3A3C
notification       = 409CFF
notification-error = FF6961
misc               = 8E8E93
; --- CupertinoMusic 전용 키 ---
ink                = FFFFFF
; accent-text: 어두운 표면에서 5:1 이상을 유지하는 밝은 붉은색
accent-text        = FF6B7D
accent-solid       = E0173A
on-accent          = FFFFFF
negative           = FF6961
warning            = FFB340
positive           = 30D158
announcement       = 409CFF
toggle-on          = 30D158
over-media         = 1C1C1E
